<!doctype html>
<!--
PROTÓTIPO NAVEGÁVEL OFICIAL DO TIME (Desafio 05, Shopping Exemplo)
Une as jornadas e as regras de journeys.html com a UI/UX aprovada; tema, telas e jornadas em docs/design.md.
Arquivo único, sem build, estado em memória (recarregar a página reinicia). Tudo é simulado e fictício.

TELAS
 Visitante e Não logado: início (carrossel, atalhos, lojas, grade), campanhas, ofertas, detalhe da oferta
   (em breve, liberada, esgotada com alternativas, encerrada, já resgatada), cupom resgatado, meus cupons,
   comprovar compra, pontos (com troca), confirmar troca, indicar, perfil (consentimento, instalar app, sair),
   criar conta (convite, com código de indicação opcional), aviso de lote liberado.
 Lojista: início, criar oferta relâmpago (com prévia ao vivo), acompanhar oferta (encerrar), confirmar compra, perfil.
 Shopping: painel da campanha (lotes, liberar lote, números agregados), campanhas, ofertas relâmpago das lojas, perfil.
 Painel de demonstração (fora do app): perfil/usuário, jornadas J1 a J8 com "Próximo passo", reiniciar.

JORNADAS J1 a J8: todas chegam ao fim pelo botão "Próximo passo". Cada passo executa antes, se faltar, a ação manual
 do passo anterior (marcar presença, resgatar, gerar código...), então dá para clicar só em "Próximo passo".

DECISÕES PRÓPRIAS (validar com o time)
 1. Escolher uma jornada reinicia o estado (evita lote já liberado, cupons antigos etc.). "Reiniciar demonstração" faz o mesmo.
 2. O lote das placas (surpresa) é liberado só por "Liberar lote agora" (Shopping); dura 5 min. Sem liberação automática.
 3. Contagem da campanha no início: "termina em 2 h" a partir da abertura (a campanha é "hoje").
 4. Jornada 3: "Simulação: outros visitantes esgotam o lote" zera o estoque por um botão do passo.
 5. Pontos com 1 casa decimal (1 ponto a cada R$ 10, compras pequenas pontuam). Recompensas: R$ 10 (500), estacionamento 2 h (500),
    R$ 25 (1.200); limite de 1 resgate por tipo por pessoa. Sem validade de pontos (não decidida).
 6. Cupons e código de compra: cupom vale 60 min, código vale 10 min e é de uso único; "Simular vencimento" só para demonstrar o erro.
 7. Um cupom por pessoa por oferta. Ofertas relâmpago: 1 min (demonstração), 3 min, 10 min ou 1 h.
 8. Ana ao "criar conta" é sempre a conta da Ana (protótipo). Código de indicação aceito: BRUNO100.
 9. Menu do topo abre o perfil; busca, "Ver todas" e a grade original (Lojas, Mapa...) mostram aviso "fora do protótipo".
 10. Números do painel do Shopping incluem um histórico inicial de demonstração, só agregados.
O logo é carregado só por link remoto (nada salvo no repositório).
-->

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f1=n=>String(Math.round(n*10)/10).replace('.',',');
const money=n=>'R$ '+Number(n).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const ic=(n,c='')=>`<svg class="ic ${c}"><use href="#${n}"/></svg>`;
const LOGO='https://www.capimdouradosc.com.br/images/logo.png';
const people={guest:{name:'Convidado',role:'Não logado'},ana:{name:'Ana',role:'Visitante'},bruno:{name:'Bruno',role:'Visitante'},tech:{name:'TechPlay',role:'Lojista'},cafe:{name:'Café Ipê',role:'Lojista'},admin:{name:'Administração',role:'Shopping'}};
const ROLES=['Não logado','Visitante','Lojista','Shopping'];
const USERDESC={guest:'Sem conta',ana:'Nova · 0 pontos',bruno:'420 pontos · 1 cupom',tech:'Eletrônicos · campanha 11/11',cafe:'Fora da campanha',admin:'Shopping Exemplo'};
const REWARDS=[{id:'d10',title:'R$ 10 de desconto',sub:'Cupom para usar nas lojas',cost:500,icon:'coupon',c:'c-rust'},{id:'park',title:'Estacionamento 2 h',sub:'Saída sem cobrança',cost:500,icon:'pin',c:'c-green',sim:true},{id:'d25',title:'R$ 25 de desconto',sub:'Cupom para usar nas lojas',cost:1200,icon:'coupon',c:'c-gold'}];
const GATED=new Set(['coupons','purchase','points','exchange','referral']);
let state,current='guest',screen='home',hist=[],selected='gpu',rewardSel='d10',sel=null,carI=0,carT=null,carMoved=false,panelRole='Não logado',jIdx=-1,jStep=-1,signupCtx={reason:'general',ret:'home'},msg='',fp='',toastT=null,toastGo=null;
let form={code:'',value:'',prod:'Café expresso',disc:20,dur:180,qty:5,ref:'',name:'',email:''};

function initial(){const n=Date.now();return{campEnd:n+2*3600e3,
 users:{ana:{points:0,coupons:[],history:[],present:false,referrer:null,bonus:false,marketing:false,rewards:[],invited:[]},
  bruno:{points:420,coupons:[{id:'CAFE20',title:'Café Ipê · 20% de desconto',store:'Café Ipê',used:false,end:n+3*3600e3}],history:[{title:'Compra na TechPlay',points:200},{title:'Compra no Café Ipê',points:20},{title:'Bônus de indicação (Carla)',points:100},{title:'Compra na TechPlay',points:100}],present:false,referrer:null,bonus:true,marketing:false,rewards:[],invited:[{name:'Carla',done:true}]}},
 offers:[
  {id:'gpu',title:'Placa de vídeo',store:'TechPlay',floor:'Piso L2',owner:'tech',discount:60,orig:2499,stock:5,total:5,start:null,end:null,closed:false,campaign:true,icon:'gpu'},
  {id:'livro',title:'Box de livros',store:'Livraria Folha',floor:'Piso L1',owner:null,discount:40,orig:120,stock:18,total:30,start:n-3600e3,end:n+2*3600e3,closed:false,campaign:true,icon:'book'},
  {id:'moda',title:'Tênis casual',store:'Moda Sol',floor:'Piso L1',owner:null,discount:30,orig:300,stock:11,total:20,start:n-3600e3,end:n+2*3600e3,closed:false,campaign:true,icon:'tag'},
  {id:'coffee',title:'Café expresso',store:'Café Ipê',floor:'Praça de alimentação',owner:'cafe',discount:20,orig:12,stock:9,total:12,start:n,end:n+20*60e3,closed:false,campaign:false,icon:'drop'}],
 codes:[],purchases:[],notices:[],results:{},seq:1000}}
state=initial();

const user=()=>state.users[current]||null;
const isStaff=()=>['Lojista','Shopping'].includes(people[current].role);
const offerOf=id=>state.offers.find(o=>o.id===id);
function status(o){const n=Date.now();if(o.closed||(o.end&&n>=o.end))return'Encerrada';if(!o.start||n<o.start)return'Em breve';if(o.stock<=0)return'Esgotada';return'Liberada'}
function rem(end){const s=Math.max(0,Math.ceil((end-Date.now())/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60,p=v=>String(v).padStart(2,'0');return h?`${h}:${p(m)}:${p(x)}`:`${p(m)}:${p(x)}`}
const clk=end=>`<span data-end="${end}">${rem(end)}</span>`;
const hhmm=()=>new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const finalPrice=o=>o.orig?o.orig*(1-o.discount/100):null;
const flashes=()=>state.offers.filter(o=>!o.campaign);
const liveFlash=()=>[...flashes()].reverse().find(o=>status(o)==='Liberada');
const hasCoupon=(uid,oid)=>state.users[uid].coupons.some(c=>c.offer===oid);
const lastCode=uid=>[...state.codes].reverse().find(c=>c.user===uid);
const activeCode=uid=>{const c=lastCode(uid);return c&&!c.used&&c.end>Date.now()?c:null};
const fmtCode=c=>c.slice(0,3)+' '+c.slice(3);
function nextTarget(p){return REWARDS.find(r=>r.cost>p)||null}

/* ---------- ações de domínio ---------- */
function doClaim(uid,oid){const o=offerOf(oid),u=state.users[uid];if(status(o)!=='Liberada'||hasCoupon(uid,oid))return null;o.stock--;const c={id:'CUP'+(++state.seq),title:`${o.title} · ${o.discount}% de desconto`,store:o.store,offer:oid,used:false,end:Date.now()+60*60e3};u.coupons.push(c);return c}
function doRelease(){const g=offerOf('gpu');if(status(g)!=='Em breve')return false;g.start=Date.now();g.end=Date.now()+5*60e3;for(const[id,u]of Object.entries(state.users))if(u.present)state.notices.push({id,text:'Lote liberado! As placas de vídeo já estão disponíveis.',offer:'gpu',read:false});return true}
function newCode(uid){const c={code:String(100000+Math.floor(Math.random()*899999)),user:uid,end:Date.now()+10*60e3,used:false};state.codes.push(c);delete state.results[uid];return c}
function doConfirm(codeStr,value,storeId){const rec=state.codes.find(c=>c.code===String(codeStr).replace(/\D/g,''));
 if(!rec)return{ok:false,msg:'Código inválido. Confira os 6 dígitos com o cliente.'};
 if(rec.used)return{ok:false,msg:'Código já usado. Nenhum ponto foi creditado novamente.'};
 if(rec.end<=Date.now())return{ok:false,msg:'Código vencido. Peça ao cliente um novo código.'};
 if(!Number.isFinite(value)||value<=0)return{ok:false,msg:'Informe um valor de compra maior que zero.'};
 rec.used=true;const buyer=state.users[rec.user],pts=Math.round(value)/10;buyer.points=Math.round((buyer.points+pts)*10)/10;
 buyer.history.unshift({title:'Compra na '+people[storeId].name,points:pts});state.purchases.push({user:rec.user,store:storeId,value,points:pts});
 let bonus=0;if(buyer.referrer&&!buyer.bonus){buyer.bonus=true;bonus=100;buyer.points+=100;buyer.history.unshift({title:'Bônus de indicação',points:100});const r=state.users[buyer.referrer];r.points+=100;r.history.unshift({title:`Bônus de indicação (${people[rec.user].name})`,points:100});const inv=r.invited.find(i=>i.name===people[rec.user].name);if(inv)inv.done=true}
 state.results[rec.user]={pts,bonus,value,store:people[storeId].name};
 return{ok:true,msg:`Compra confirmada: ${money(value)}. ${f1(pts)} pontos creditados${bonus?' + bônus de indicação de 100 pontos':''}. Código consumido.`}}
function doRedeem(uid,rid){const u=state.users[uid],r=REWARDS.find(x=>x.id===rid);if(!r||u.points<r.cost||u.rewards.includes(rid))return false;u.points=Math.round((u.points-r.cost)*10)/10;u.rewards.push(rid);u.history.unshift({title:'Troca: '+r.title,points:-r.cost});u.coupons.push({id:'BEN'+(++state.seq),title:r.title,store:'Shopping Exemplo',used:false,end:Date.now()+60*60e3,sim:!!r.sim});return true}
function doPublish(){const q=Number(form.qty),d=Number(form.disc),dur=Number(form.dur);if(!form.prod.trim()||!Number.isInteger(q)||q<1||q>1000||!(d>=1&&d<=90))return null;const o={id:'f'+(++state.seq),title:form.prod.trim(),store:people[current].name,floor:'',owner:current,discount:d,orig:null,stock:q,total:q,start:Date.now(),end:Date.now()+dur*1000,closed:false,campaign:false,icon:'bolt'};state.offers.push(o);return o}

/* ---------- navegação ---------- */
const homeOf=()=>current==='admin'?'shome':people[current].role==='Lojista'?'mhome':'home';
function go(s){if(!user()&&GATED.has(s)){signupCtx={reason:s,ret:s};if(screen!=='signup')hist.push(screen);screen='signup';msg='';render();return}
 if(s===homeOf()){hist=[]}else if(s!==screen)hist.push(screen);screen=s;msg='';render();const sc=$('sc');if(sc)sc.scrollTop=0}
function back(){screen=hist.pop()||homeOf();msg='';render()}
function needLogin(reason,ret){signupCtx={reason,ret:ret||screen};hist.push(screen);screen='signup';msg='';render()}
function switchUser(id,s){current=id;hist=[];screen=s||homeOf();msg='';render();renderPanel();checkNotices()}
function menuTap(){user()?go('profile'):needLogin('general','home')}
function toast(t,target){const e=$('toast');e.textContent=t;e.classList.add('show');toastGo=target||null;clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),5000)}
function checkNotices(){const n=state.notices.find(x=>x.id===current&&!x.read);if(n){n.read=true;toast('Simulação · '+n.text+' Toque para ver.',n.offer)}}
function openOffer(id){selected=id;go('detail')}
function openTrack(id){sel=id;go('track')}

/* ---------- componentes ---------- */
function chipFor(o){const s=status(o),c={'Liberada':'live','Em breve':'soon','Esgotada':'out','Encerrada':'end'}[s];return`<span class="chip ${c}">${s}</span>`}
function offerRow(o,click){const s=status(o),extra=s==='Liberada'?`<span class="chip">${o.stock} restantes</span><span class="chip a">${clk(o.end)}</span>`:s==='Em breve'?'<span class="chip">Lote surpresa</span>':'';
 return`<div class="offer" onclick="${click||`openOffer('${o.id}')`}"><div class="logo">${ic(o.icon)}</div><div><b>${esc(o.title)} · ${o.discount}% OFF</b><div class="s">${esc(o.store)}</div>${chipFor(o)}${extra}</div>${ic('chev','')}</div>`}
const sc=(icon,label,act)=>`<div class="sc" onclick="${act}"><i>${ic(icon)}</i>${label}</div>`;
const tile=(v,l)=>`<div class="tile"><b>${v}</b><span>${l}</span></div>`;
const tagS='<span class="tag">Simulação</span>',tagV='<span class="tag">Valor ilustrativo</span>';
const hist_rows=u=>u.history.map(h=>`<div class="li" style="min-height:52px"><div style="flex:1">${esc(h.title)}</div><span class="t ${h.points>0?'g':''}">${h.points>0?'+':''}${f1(h.points)} pts</span></div>`).join('')||'<div class="note" style="text-align:left">Sua primeira compra começa essa história.</div>';
const soon=()=>toast('Fora do protótipo.');

/* ---------- telas ---------- */
function sHome(){const u=user(),g=offerOf('gpu'),fl=liveFlash(),pend=u&&u.present&&status(g)==='Liberada'&&!hasCoupon(current,'gpu');
 const t=nextTarget(u?u.points:0);
 const s1=`<div class="slide s1" onclick="slideGo('campaigns')"><small>Campanha</small><b>11/11 no Shopping Exemplo</b><span>${status(g)==='Em breve'?'Próximo lote: surpresa · hoje':status(g)==='Liberada'?'Lote liberado: placas de vídeo com 60% OFF':'Lote das placas encerrado'}</span><em class="cd">Termina em ${clk(state.campEnd)}</em></div>`;
 const s2=fl?`<div class="slide s2" onclick="slideGo('detail','${fl.id}')"><small>Oferta relâmpago</small><b>${esc(fl.store)} · ${esc(fl.title)} ${fl.discount}% OFF</b><span>Termina em ${clk(fl.end)} · ${fl.stock} restantes</span></div>`:`<div class="slide s2" onclick="slideGo('offers')"><small>Oferta relâmpago</small><b>Nenhuma oferta agora</b><span>Volte em breve ou veja todas as ofertas</span></div>`;
 const s3=u?`<div class="slide s3" onclick="slideGo('points')"><small>Seus pontos</small><b>${f1(u.points)} pontos</b><span>${t?`Faltam ${f1(t.cost-u.points)} para ${t.title}`:'Você pode trocar por qualquer recompensa'}</span></div>`:`<div class="slide s3" onclick="slideGo('signup')"><small>Pontos e indicação</small><b>Ganhe pontos a cada compra</b><span>Crie sua conta · 1 ponto a cada R$ 10</span></div>`;
 return{cls:'home',body:`<div class="car" id="car"><div class="track">${s1}${s2}${s3}</div><div class="dots"><button aria-label="Slide 1"><i></i></button><button aria-label="Slide 2"><i></i></button><button aria-label="Slide 3"><i></i></button></div></div>
 <div class="rowsc">${sc('camp','Campanhas',"go('campaigns')")}${sc('tag','Ofertas',"go('offers')")}${sc('coupon','Meus cupons',"go('coupons')")}${sc('receipt','Comprovar compra',"go('purchase')")}${sc('star','Pontos',"go('points')")}${sc('share','Indicar',"go('referral')")}</div>
 <div class="pad" style="padding-top:0">
 ${pend?`<div class="card" style="cursor:pointer" onclick="openOffer('gpu')"><div class="ico">${ic('bolt')}</div><div style="flex:1"><b>Lote liberado agora</b><small>Placas de vídeo com 60% OFF · toque para resgatar</small></div>${tagS}</div>`:''}
 ${!u?`<div class="card"><div class="ico">${ic('star')}</div><div style="flex:1"><b>Pontos e indicação</b><small>1 ponto a cada R$ 10 · indique e ganhem 100 pontos cada</small></div>${tagV}</div><button class="btn" onclick="needLogin('general','home')">Criar conta</button>`:''}
 <div class="sec"><h2>Lojas</h2><a onclick="soon()">Ver todas</a></div>
 <div class="stores"><div>Tech<br>Play</div><div>Café<br>Ipê</div><div>Livraria<br>Folha</div><div>Moda<br>Sol</div><div>Loja E</div><div>Loja F</div></div>
 <div class="sec"><h2>Atalhos</h2></div>
 <div class="grid">${sc('store','Lojas','soon()')}${sc('food','Alimentação','soon()')}${sc('tool','Serviços','soon()')}${sc('news','Notícias','soon()')}${sc('event','Eventos','soon()')}${sc('tag','Promoções',"go('offers')")}${sc('coupon','Cupons',"go('coupons')")}${sc('film','Cinema','soon()')}${sc('map','Mapa','soon()')}</div>
 <div style="height:8px;flex:none"></div></div>`}}
function slideGo(s,id){if(carMoved)return;if(s==='detail')openOffer(id);else go(s)}

function sCampaigns(){const u=user(),g=offerOf('gpu'),lote2=status(g);
 return{title:'Campanhas',body:`<div class="banner"><span style="font-size:12px;font-weight:600;letter-spacing:.6px">CAMPANHA RECORRENTE</span><b>11/11 no Shopping Exemplo</b><span style="font-size:13px">Termina em ${clk(state.campEnd)}</span></div>
 <div class="sec"><h2>Lotes de hoje</h2></div>
 <div class="compact">${ic('clock')}<b>Lote 1 · 10h</b><span>Livraria Folha e Moda Sol</span><span class="chip live" style="flex:none;margin:0">Liberado</span></div>
 <div class="compact">${ic('bolt')}<b>Lote 2 · surpresa</b><span>5 placas de vídeo · 60% OFF</span><span class="chip ${{'Em breve':'soon','Liberada':'live','Esgotada':'out','Encerrada':'end'}[lote2]}" style="flex:none;margin:0">${lote2==='Em breve'?'Em breve':lote2}</span></div>
 ${u?`<button class="btn ${u.present?'sec2':'out'}" onclick="presence()" ${u.present?'disabled':''}>${u.present?'Presença marcada ✓':'Estou no shopping'}</button><div class="note">${tagS} Marque e receba o aviso do lote surpresa</div>`:''}
 <div class="sec"><h2>Ofertas da campanha</h2></div>${state.offers.filter(o=>o.campaign).map(o=>offerRow(o)).join('')}`}}
function sOffers(){const order={Liberada:0,'Em breve':1,Esgotada:2,Encerrada:3};const l=a=>[...a].sort((x,y)=>order[status(x)]-order[status(y)]).map(o=>offerRow(o)).join('')||'<div class="note" style="text-align:left">Nenhuma oferta.</div>';
 return{title:'Ofertas',body:`<div class="sec" style="margin-top:0"><h2>Campanha 11/11</h2></div>${l(state.offers.filter(o=>o.campaign))}<div class="sec"><h2>Ofertas relâmpago</h2></div>${l(flashes())}`}}
function presence(){if(!user())return needLogin('presence');state.users[current].present=true;toast('Simulação · Presença marcada. Avisaremos quando o lote abrir.');render()}

function sDetail(){const o=offerOf(selected),u=user(),s=status(o),claimed=u&&hasCoupon(current,o.id),fp_=finalPrice(o);
 const alts=state.offers.filter(x=>x.id!==o.id&&status(x)==='Liberada');
 let state_=`<div class="compact" style="margin-top:14px">${ic('bolt','')}<b>${s==='Liberada'?'Liberada agora':s==='Em breve'?'Em breve':s}</b><span></span>${s==='Liberada'?`<span class="chip a" style="margin:0;font-size:14px;flex:none">${clk(o.end)}</span>`:''}</div>`;
 const pct=o.total?Math.round(o.stock/o.total*100):0;
 let bar=s==='Em breve'?'':`<div style="padding:12px 0 4px;flex:none"><div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px"><span>${o.stock} de ${o.total} restantes</span><span style="color:var(--muted)">${pct}%</span></div><div class="bar-p"><i style="width:${pct}%"></i></div></div>`;
 let extra='',cta='';
 if(s==='Em breve'){extra=`<div class="warn">${ic('pin')}Lote surpresa: o horário não é divulgado${tagS}</div>`;cta=`<button class="btn" disabled>Em breve</button>${u?`<button class="btn out" onclick="presence()" ${u.present?'disabled':''}>${u.present?'Presença marcada ✓ · você será avisado':'Estou no shopping · receber aviso'}</button>`:`<button class="btn out" onclick="needLogin('presence','detail')">Criar conta para receber o aviso</button>`}`}
 else if(s==='Liberada'){extra=u&&u.present?`<div class="warn">${ic('pin')}Você está no shopping${tagS}</div>`:'';cta=claimed?`<button class="btn sec2" onclick="go('coupons')">Cupom resgatado · ver em Meus cupons</button>`:`<button class="btn" onclick="claimTap('${o.id}')">Resgatar cupom</button><div class="note">1 cupom por pessoa${u?'':' · exige conta'}</div>`}

/* ---------- render ---------- */
const STATUS=()=>`<div class="status"><span class="tm">${hhmm()}</span><span class="r"><svg width="16" height="11" viewBox="0 0 16 11"><path d="M0 8h3v3H0zm4-3h3v6H4zm4-3h3v9H8zm4-2h3v11h-3z" fill="currentColor"/></svg><span class="bat"></span></span></div>`;
function frame(s){
 if(s.cls==='home')return STATUS()+`<div class="bar"><button aria-label="Menu" onclick="menuTap()">${ic('menu')}</button><h1 class="brand"><img src="${LOGO}" alt="Shopping Exemplo"></h1><button aria-label="Buscar" onclick="soon()">${ic('search')}</button></div><div class="scroll n" id="sc">${s.body}</div>`;
 if(s.cls==='ptsx')return STATUS()+s.hd+`<div class="scroll" id="sc" style="padding:0 0 16px">${s.body}</div>`;
 const left=s.back===false?'<span></span>':`<button aria-label="Voltar" onclick="back()">${ic('back')}</button>`;
 return STATUS()+`<div class="bar">${left}<h1>${s.title}</h1>${s.right||'<span></span>'}</div><div class="scroll" id="sc">${s.body}</div>`}
function render(keep){
 const old=$('sc'),y=keep&&old?old.scrollTop:0;
 if(!SCREENS[screen])screen=homeOf();
 const s=SCREENS[screen]();const ph=$('phone');
 ph.className='phone '+(s.cls||'');
 ph.innerHTML=frame(s)+'<div class="toast" id="toast" onclick="toastTap()"></div>';
 const sc_=$('sc');if(sc_&&y)sc_.scrollTop=y;
 if(s.cls==='home'){initCar();const st=ph.querySelector('.status'),br=ph.querySelector('.bar'),on=()=>{const o=sc_.scrollTop>8;st.classList.toggle('solid',o);br.classList.toggle('solid',o)};sc_.addEventListener('scroll',on);on()}
 if(s.cls==='ptsx')ph.style.setProperty('--toph',($('hd').getBoundingClientRect().bottom-ph.getBoundingClientRect().top)+'px');
 fp=fingerprint()}
function toastTap(){const t=toastGo;$('toast').classList.remove('show');if(t)openOffer(t)}
const fingerprint=()=>state.offers.map(o=>status(o)).join('|')+'|'+(user()?user().coupons.filter(c=>c.end>Date.now()&&!c.used).length:'')+'|'+state.notices.length;
function initCar(){const c=$('car'),t=c.querySelector('.track'),n=3,dots=[...c.querySelectorAll('.dots button')];let x0=null,dx=0;
 const W=()=>c.clientWidth;
 function g(k,anim=true){carI=(k+n)%n;t.style.transition=anim?'transform .45s ease':'none';t.style.transform=`translateX(${-carI*W()}px)`;dots.forEach((d,j)=>d.classList.toggle('on',j===carI))}
 function start(){clearInterval(carT);carT=setInterval(()=>{if($('car')===c)g(carI+1);else clearInterval(carT)},4500)}
 dots.forEach((d,j)=>d.addEventListener('click',()=>{g(j);start()}));
 c.addEventListener('pointerdown',e=>{x0=e.clientX;dx=0;carMoved=false;clearInterval(carT);t.style.transition='none'});
 const mv=e=>{if(x0===null)return;dx=e.clientX-x0;t.style.transform=`translateX(${-carI*W()+dx}px)`};
 const up=()=>{if(x0===null)return;x0=null;carMoved=Math.abs(dx)>6;if(dx<-40)g(carI+1);else if(dx>40)g(carI-1);else g(carI);start();setTimeout(()=>carMoved=false,50)};
 window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);
 g(carI,false);start()}

const MNAMES=null;
function ensureClaim(uid,oid){if(!hasCoupon(uid,oid))doClaim(uid,oid)}
function ensureCode(uid){return activeCode(uid)||newCode(uid)}
function ensureConfirm(uid,val,store){const c=activeCode(uid);if(c)doConfirm(c.code,Number(form.value)||val,store)}
function ensureRelease(){doRelease()}
function ensurePresence(uid){state.users[uid].present=true}
function prefillConfirm(uid,val){form.code=fmtCode(ensureCode(uid).code);form.value=String(val);form.res=null}
function latestFlash(owner){return[...state.offers].reverse().find(o=>o.owner===owner&&!o.campaign&&o.id.startsWith('f'))}
function sellOut(){const g=offerOf('gpu');if(g.stock>0&&status(g)==='Liberada'){g.stock=0;toast('Simulação · Outros visitantes resgataram as 5 placas.')}}
function ensureBalance(uid,min){const u=state.users[uid];if(u.points<min){u.history.unshift({title:'Ajuste de demonstração (compra simulada)',points:min-u.points});u.points=min}}
function ensureSignupRef(){const a=state.users.ana;if(!a.referrer&&!a.history.length){a.referrer='bruno';if(!state.users.bruno.invited.some(i=>i.name==='Ana'))state.users.bruno.invited.push({name:'Ana',done:false})}}
function ensurePublish(){if(!latestFlash('tech')){current='tech';Object.assign(form,{prod:'Fone Bluetooth',disc:30,dur:60,qty:2});const o=doPublish();if(o)sel=o.id}}

function runStep(j,i){const st=J[j].steps[i];jIdx=j;if(st.pre)st.pre();
 if(st.o)selected=typeof st.o==='function'?st.o():st.o;
 current=st.u;hist=[];if(st.s==='track')sel=selected;if(st.act)st.act();
 screen=st.s;msg='';jStep=i;render();renderPanel();checkNotices()}
function startJourney(j){state=initial();form={code:'',value:'',prod:'Café expresso',disc:20,dur:180,qty:5,ref:'',name:'',email:''};selected='gpu';sel=null;rewardSel='d10';jIdx=j;jStep=-1;current='guest';screen='home';hist=[];render();renderPanel()}
function nextStep(){if(jIdx<0)return;if(jStep+1<J[jIdx].steps.length)runStep(jIdx,jStep+1)}
function resetDemo(){state=initial();form={code:'',value:'',prod:'Café expresso',disc:20,dur:180,qty:5,ref:'',name:'',email:''};selected='gpu';sel=null;jIdx=-1;jStep=-1;current='guest';panelRole='Não logado';hist=[];screen='home';render();renderPanel()}
function pickRole(r){renderPanel(r)}
function renderPanel(r){
 panelRole=r||people[current].role;
 const users=Object.entries(people).filter(([id,p])=>p.role===panelRole);
 let h=`<h3>Perfil</h3><div class="pb">${ROLES.map(r=>`<button class="pill ${r===panelRole?'on':''}" onclick="pickRole('${r}')">${r}</button>`).join('')}</div>`;
 h+=users.map(([id,p])=>`<button class="usr ${id===current?'on':''}" onclick="switchUser('${id}')"><span><b>${p.name}</b> · ${USERDESC[id]}</span><span>${id===current?'✓':'→'}</span></button>`).join('');
 h+=`<div class="who">Agora: <b>${people[current].name}</b> (${people[current].role})</div>`;
 h+=`<h3>Jornadas</h3>`+J.map((j,i)=>`<button class="jb ${i===jIdx?'on':''}" onclick="startJourney(${i})"><b>J${i+1}</b> ${j.t}</button>`).join('');
 if(jIdx>=0){const jj=J[jIdx],last=jStep>=jj.steps.length-1;
  h+=`<ol>${jj.steps.map((s,i)=>`<li class="${i===jStep?'cur':i<jStep?'done':''}" onclick="runStep(${jIdx},${i})"><b>${i<jStep?'✓':i+1}</b><span>${s.x} <i style="color:var(--muted)">(${people[s.u].name})</i></span></li>`).join('')}</ol>`;
  h+=`<button class="go" onclick="nextStep()" ${last?'disabled':''}>${jStep<0?'Começar':last?'Fim da jornada':'Próximo passo'}</button><small>Escolher uma jornada reinicia o estado. Clique num passo para ir direto a ele.</small>`}
 h+=`<button class="rst" onclick="resetDemo()">Reiniciar demonstração</button>`;
 h+=`<small>${tagS} = simulado. ${tagV} = regra ainda não decidida (1 ponto a cada R$ 10; recompensas desde 500; bônus de indicação 100 cada lado).</small>`;
 $('panel').innerHTML=h}
