<!doctype html>
<!--
Protótipo mobile independente, com estado compartilhado em memória nesta aba.
Abre como Ana, perfil Visitante, sem autenticação. Perfil apresenta somente as
opções Visitante (Ana e Bruno), Lojista (TechPlay e Café Ipê) e Shopping (Administração).
Selecionar uma opção abre o início correspondente e preserva os dados compartilhados.
Telas: início, ofertas/detalhe, confirmação de cupom, meus cupons, comprovar compra,
pontos/extrato/troca, indicação, seletor de perfis, início do lojista, criação/prévia
 de oferta, confirmação de compra, painel do shopping e campanhas.
Decisões ilustrativas: 1 ponto por R$ 10, benefícios de 500 pontos com limite de um
resgate de cada tipo por pessoa; códigos de compra de uso único com 10 minutos;
bônus de indicação de 100 pontos por lado na primeira compra. Sem persistência.
Campanha 11/11 é cenário simulado com lote surpresa automático após 90 segundos,
duração de 5 minutos, estoque de 5 unidades e um cupom por pessoa por oferta.
Ofertas encerram ao expirar ou esgotar. Compra e benefícios são simulados.
Em desktop, moldura de 390 x 844; em celular, ocupa toda a tela disponível.
Fontes e Tailwind via CDN precisam de internet. Títulos Bricolage Grotesque,
corpo DM Sans. Paleta floresta #233e32, cobre #a44614, creme #fffdf9.
-->
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shopping Exemplo · Protótipo</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'DM Sans',sans-serif;background:#eeeae4;color:#25241f}h1,h2,h3,.display{font-family:'Bricolage Grotesque',sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.5}button:focus-visible,a:focus-visible{outline:3px solid #347a65;outline-offset:3px}input,select{width:100%;padding:12px;border:1px solid #c9c6be;border-radius:12px;background:white}label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}.phone{width:390px;height:844px;flex-shrink:0;box-shadow:0 20px 70px #33271820;border:8px solid #262820;border-radius:42px;overflow:hidden;background:#fffdf9;position:relative}.scroll{height:100%;overflow:auto;padding:26px 20px 100px;scrollbar-width:thin}.primary{background:#a44614;color:white}.card{background:white;border:1px solid #e8e2d8;border-radius:20px;padding:18px}.badge{font-size:10px;letter-spacing:.05em;background:#f9ebd9;color:#843d16;border-radius:5px;padding:4px 6px;display:inline-block}.muted{color:#6c6d62}.hero{background:linear-gradient(135deg,#233e32,#416b4a);color:#fffdf3;border-radius:24px;padding:24px}.ticket{border:1px dashed #bf8759;background:#fff7e9;border-radius:18px;padding:18px}.nav{position:absolute;bottom:0;width:100%;display:flex;background:#fffdf9;border-top:1px solid #e8e2d8;padding:12px 5px 20px}.nav button{flex:1;font-size:11px;padding:5px 0;color:#676b60}.nav button.active{color:#a44614;font-weight:700}#toast{position:absolute;top:60px;left:15px;right:15px;z-index:30;background:#233e32;color:white;padding:16px;border-radius:14px;box-shadow:0 8px 30px #0003}summary{cursor:pointer}#guide{max-width:760px;width:90%;border-radius:24px;padding:28px}dialog::backdrop{background:#17231dcc}@media(max-width:750px){.phone{margin:auto}body{padding:12px!important}}body{padding:0!important;background:#dedfd8}.mobile-stage{min-height:100dvh;display:grid;place-items:center;padding:22px}.phone{height:844px;width:390px;border:7px solid #252820;border-radius:46px}.statusbar{height:45px;padding:10px 23px 0;display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;position:relative;background:#fffdf9}.island{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:98px;height:24px;border-radius:20px;background:#252820}.scroll{height:calc(100% - 45px);padding-top:18px}.nav{padding-bottom:25px}.home-indicator{position:absolute;bottom:7px;width:115px;height:4px;border-radius:8px;background:#252820;left:50%;transform:translateX(-50%);pointer-events:none}.nav button{min-height:44px}#toast{top:50px}@media(max-width:430px){.mobile-stage{padding:0;display:block}.phone{width:100%;height:100dvh;border:0;border-radius:0;box-shadow:none}.statusbar{padding-top:10px}.scroll{scrollbar-width:none}.nav{padding-bottom:max(22px,env(safe-area-inset-bottom))}}@media(min-width:431px) and (max-height:890px){.mobile-stage{padding:8px}.phone{height:calc(100dvh - 16px)}}
</style></head>
<body><main class="mobile-stage"><div class="phone"><div class="statusbar" aria-hidden="true"><span>9:41</span><span class="island"></span><span>▮▮▮ &nbsp; ▰</span></div><div id="app" class="scroll"></div><div id="toast" role="status" hidden></div><nav id="nav" class="nav" aria-label="Navegação principal"></nav><div class="home-indicator" aria-hidden="true"></div></div></main><script>
const $=id=>document.getElementById(id);
const people={guest:{name:'Convidado',role:'Não logado'},ana:{name:'Ana',role:'Visitante'},bruno:{name:'Bruno',role:'Visitante'},tech:{name:'TechPlay',role:'Lojista'},cafe:{name:'Café Ipê',role:'Lojista'},admin:{name:'Administração',role:'Shopping'}};
let state,current='ana',screen='home',selected='gpu',returnAction=null,role='Visitante',message='',draft=null,rewardType='discount',journeyIndex=-1,stepIndex=-1;
const escapeText=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
function initial(){const now=Date.now();return{start:now,release:now+90000,campaign:now+45000,users:{ana:{points:0,coupons:[],history:[],present:false,referrer:null,bonus:false,marketing:false,rewards:[]},bruno:{points:420,coupons:[{id:'BASE01',title:'Café Ipê · 20%',used:false,end:now+600000}],history:[{title:'Compra na TechPlay',points:200},{title:'Compra no Café Ipê',points:20},{title:'Bônus de indicação concluída',points:100},{title:'Compra na TechPlay',points:100}],present:false,referrer:null,bonus:true,marketing:false,rewards:[]}},offers:[{id:'gpu',title:'Placa de vídeo',store:'TechPlay',owner:'tech',discount:60,stock:5,total:5,start:now+90000,end:now+390000,emoji:'🎮',campaign:true},{id:'coffee',title:'Café expresso',store:'Café Ipê',owner:'cafe',discount:20,stock:12,total:12,start:now,end:now+360000,emoji:'☕'}],codes:[],purchases:[],notices:[],sequence:100000};}
state=initial();
function user(){return state.users[current]} function offer(){return state.offers.find(item=>item.id===selected)||state.offers[0]}
function remaining(end){const seconds=Math.max(0,Math.ceil((end-Date.now())/1000));return Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0')}
function status(item){if(item.closed||Date.now()>=item.end)return'Encerrada';if(!item.stock)return'Esgotada';if(Date.now()<item.start)return'Em breve';return'Liberada'}
function button(text,action,secondary=false,disabled=false){return `<button ${disabled?'disabled':''} class="${secondary?'border border-stone-300 bg-white':'primary'} rounded-xl px-4 py-3 w-full font-semibold mt-3" onclick="${action}">${text}</button>`}
function badge(text='Simulação'){return `<span class="badge">${text}</span>`}
function go(next){screen=next;message='';render();$('app').scrollTop=0}
function loginFor(action){if(!user()){returnAction=action;go('login');return false}return true}
function switchUser(id,next='home'){current=id;role=people[id].role;message='';screen=next;render();}
function signIn(){const code=$('referral')?.value.trim().toUpperCase();if(code&&code!=='BRUNO100'){message='Use BRUNO100 para demonstrar a indicação.';render();return}current='ana';role='Visitante';if(code&&!user().history.length)user().referrer='bruno';screen='home';const action=returnAction;returnAction=null;render();if(action)action()}
function notice(text){$('toast').textContent=text;$('toast').hidden=false;setTimeout(()=>$('toast').hidden=true,4500)}
function offerCard(item){return `<article class="card mb-3"><div class="flex gap-3 items-center"><span class="text-4xl p-3 bg-[#f8eddd] rounded-xl">${item.emoji}</span><div class="flex-1"><p class="text-xs muted">${escapeText(item.store)}</p><h3 class="font-bold">${escapeText(item.title)}</h3><p class="text-[#a44614] font-bold">${item.discount}% de desconto</p></div></div><div class="flex justify-between text-xs mt-4"><span>${status(item)} · ${item.stock} restantes</span><span data-clock="${item.end}">${remaining(item.end)}</span></div>${button('Ver oferta',`selected='${item.id}';go('detail')`,true)}</article>`}
function header(title){return `<header class="flex items-center justify-between mb-6"><h1 class="text-2xl font-bold">${title}</h1>${badge()}</header>`}
function home(){if(people[current].role==='Lojista')return merchant();if(current==='admin')return dashboard();return `${header('Shopping Exemplo')}<p class="muted text-sm mb-5">${user()?'Olá, '+people[current].name+' · '+user().points+' pontos':'Seu próximo motivo para voltar.'}</p><div class="hero"><span class="text-xs tracking-widest">CAMPANHA RECORRENTE</span><h2 class="display text-6xl font-bold mt-2">11/11<span class="text-[#cce2ac]">.</span></h2><p class="text-lg mt-3">Cinco placas de vídeo.<br>60% de desconto.</p><p class="text-xs mt-4">${Date.now()<state.campaign?'Começa em <span data-clock="'+state.campaign+'">'+remaining(state.campaign)+'</span>':'Campanha em andamento'} · calendário simulado</p>${button('Explorar campanha',`selected='gpu';go('detail')`)}</div>${user()?`<div class="card mt-4"><div class="flex justify-between">Próximo lote ${badge()}</div><p class="font-bold mt-2">${status(state.offers[0])==='Em breve'?'Horário surpresa':status(state.offers[0])}</p>${button(user().present?'Presença marcada ✓':'Estou no shopping',"markPresence()",true)}</div><div class="grid grid-cols-2 gap-3 my-4">${button('Comprovar compra',"go('purchase')",true)}${button('Minha carteira',"go('points')",true)}</div>`:''}<h2 class="text-xl font-bold mt-6 mb-3">Ofertas relâmpago</h2>${state.offers.filter(item=>!item.campaign&&status(item)==='Liberada').map(offerCard).join('')||'<p class="muted">Nenhuma oferta ativa agora.</p>'}<div class="card mt-4"><h3 class="font-bold">Cada compra aproxima você.</h3><p class="text-sm muted mt-2">Comprove a compra para pontuar. Indique alguém e os dois ganham na primeira compra.</p>${badge('Valor ilustrativo')}${button('Conhecer a indicação',"go('referral')",true)}</div>`}
function detail(){const item=offer(),available=status(item)==='Liberada',claimed=user()?.coupons.some(c=>c.offer===item.id);return `${header('Oferta')}<button class="text-sm mb-4 muted" onclick="go('offers')">← Todas as ofertas</button><div class="hero !bg-none !bg-[#a44614]"><div class="text-8xl text-center py-5">${item.emoji}</div><p class="text-sm">${escapeText(item.store)}</p><h2 class="text-3xl font-bold my-2">${escapeText(item.title)}</h2><p class="text-4xl font-bold">${item.discount}% OFF</p><p class="mt-5">${status(item)} · ${item.stock} cupons restantes</p><p class="text-sm mt-2">${status(item)==='Em breve'?'Lote surpresa · aguarde o aviso':'Encerra em <span data-clock="'+item.end+'">'+remaining(item.end)+'</span>'}</p>${button(claimed?'Cupom já garantido':available?'Resgatar cupom':status(item),"claim()",false,!available||claimed)}</div><p class="text-xs muted mt-3">Um cupom por pessoa nesta oferta. Uso no caixa simulado.</p><h2 class="text-xl font-bold my-4">Outras ofertas</h2>${state.offers.filter(other=>other.id!==item.id).map(offerCard).join('')}`}
function claim(){if(!loginFor(claim))return;const item=offer();if(status(item)!=='Liberada'){notice('A oferta ficou indisponível. Confira as alternativas.');render();return}if(user().coupons.some(c=>c.offer===item.id))return;item.stock--;user().coupons.push({id:'CUP'+(++state.sequence),title:item.title+' · '+item.discount+'%',offer:item.id,used:false,end:Date.now()+600000});go('claimed')}
function markPresence(){if(!loginFor(markPresence))return;user().present=true;notice('Presença simulada marcada. Avisaremos quando o lote abrir.');render()}
function release(){const item=state.offers[0];if(item.released||status(item)==='Liberada')return;item.start=Date.now();item.end=Date.now()+300000;item.released=true;for(const [id,person]of Object.entries(state.users))if(person.present)state.notices.push({id,text:'Lote liberado! As placas de vídeo já estão disponíveis.'});render()}
function purchase(){if(!user())return invitation();const code=state.codes.findLast(c=>c.user===current&&!c.used&&c.end>Date.now());return `${header('Comprovar compra')}<p class="muted">Mostre o código ao lojista. Ele informa o valor no caixa para creditar seus pontos.</p>${badge()} ${badge('Valor ilustrativo')}<div class="card text-center mt-6"><p class="text-sm muted">Seu código de uso único</p><p class="display text-5xl font-bold tracking-widest my-5">${code?code.code:'••••••'}</p>${code?`<p>Válido por <span data-clock="${code.end}">${remaining(code.end)}</span></p>`:button('Gerar código',"generateCode()")}</div><h2 class="font-bold text-xl mt-6 mb-3">Compras e pontos</h2>${history()}`}
function generateCode(){if(!loginFor(generateCode))return;state.codes.push({code:String(++state.sequence),user:current,end:Date.now()+600000,used:false});render()}
function history(){return user().history.map(item=>`<div class="flex justify-between border-b py-3 text-sm"><span>${escapeText(item.title)}</span><strong>${item.points>0?'+':''}${item.points} pts</strong></div>`).join('')||'<p class="text-sm muted">Sua primeira compra começa essa história.</p>'}
function confirmPurchase(){const code=$('customerCode').value.trim(),value=Number($('purchaseValue').value),record=state.codes.find(c=>c.code===code);if(!record){message='Código inválido.'}else if(record.used){message='Código já usado. Nenhum ponto foi creditado novamente.'}else if(record.end<=Date.now()){message='Código vencido. Peça um novo código ao visitante.'}else if(!Number.isFinite(value)||value<=0){message='Informe um valor de compra maior que zero.'}else{record.used=true;const buyer=state.users[record.user],points=Math.round(value/10*100)/100;buyer.points=Math.round((buyer.points+points)*100)/100;buyer.history.unshift({title:'Compra em '+people[current].name,points});state.purchases.push({user:record.user,value,points});if(buyer.referrer&&!buyer.bonus){buyer.bonus=true;buyer.points+=100;buyer.history.unshift({title:'Bônus de indicação',points:100});state.users[buyer.referrer].points+=100;state.users[buyer.referrer].history.unshift({title:'Bônus de indicação',points:100})}message='Compra confirmada! '+points+' pontos creditados. Código consumido.'}render()}
function points(){if(!user())return invitation();const missing=Math.max(0,500-user().points);return `${header('Pontos')}<div class="hero"><p>Seu saldo</p><p class="display text-5xl font-bold mt-2">${user().points} <span class="text-lg">pontos</span></p></div><p class="text-sm my-4">${missing?'Faltam '+missing+' pontos para a próxima recompensa.':'Você já pode trocar por uma recompensa.'}</p>${badge('Valor ilustrativo')}<p class="text-xs muted mt-2">1 ponto a cada R$ 10. Cada benefício pode ser resgatado uma vez nesta sessão.</p><h2 class="text-xl font-bold my-4">Escolha seu benefício</h2>${[['discount','R$ 10 de desconto'],['parking','Estacionamento']].map(([type,title])=>`<div class="card mb-3"><h3 class="font-bold">${title}</h3><p class="muted text-sm">500 pontos · limite de 1 resgate</p>${type==='parking'?badge():''}${button(user().rewards.includes(type)?'Limite atingido':missing?'Faltam '+missing+' pontos':'Trocar pontos',`rewardType='${type}';go('exchange')`,false,missing>0||user().rewards.includes(type))}</div>`).join('')}<h2 class="font-bold text-xl my-4">Extrato</h2>${history()}`}
function exchange(){if(!user())return invitation();return `${header('Confirmar troca')}<div class="ticket"><h2 class="text-2xl font-bold">${rewardType==='parking'?'Estacionamento':'R$ 10 de desconto'}</h2>${badge('Valor ilustrativo')} ${badge()}<p class="mt-5">Saldo atual <strong>${user().points} pts</strong></p><p class="my-3">Custo <strong>500 pts</strong></p><p>Saldo após a troca <strong>${Math.max(0,user().points-500)} pts</strong></p></div>${button('Confirmar troca',"redeem()")}${button('Voltar',"go('points')",true)}`}
function redeem(){if(!user()||user().points<500||user().rewards.includes(rewardType)){notice('Saldo insuficiente ou limite de resgate atingido.');go('points');return}user().points-=500;user().rewards.push(rewardType);user().history.unshift({title:'Troca por '+(rewardType==='parking'?'estacionamento':'desconto'),points:-500});user().coupons.push({id:'BEN'+(++state.sequence),title:rewardType==='parking'?'Estacionamento':'R$ 10 de desconto',used:false,end:Date.now()+600000});go('coupons');notice('Benefício disponível em Meus cupons.')}
function coupons(){if(!user())return invitation();return `${header('Meus cupons')}<p class="text-xs muted mb-5">Apresentação e uso no caixa simulados. Validade demonstrativa de 10 minutos.</p>${user().coupons.map((c,index)=>`<div class="ticket mb-4"><h2 class="text-xl font-bold">${escapeText(c.title)}</h2><p class="text-xs mt-3">${c.used?'Usado':c.end<=Date.now()?'Vencido':'Ativo'}</p><p class="display font-bold tracking-widest text-2xl my-3">${c.id}</p>${!c.used&&c.end>Date.now()?`<p class="text-xs">Válido por <span data-clock="${c.end}">${remaining(c.end)}</span></p>${button('Simular uso no caixa',`user().coupons[${index}].used=true;render()`,true)}`:''}</div>`).join('')||'<div class="card">Seus cupons vão aparecer aqui após o resgate.</div>'}`}
function invitation(){return `${header('Sua conta')}<h2 class="text-3xl font-bold mt-10">Guarde seus benefícios.</h2><p class="muted mt-4">Entre ou crie uma conta para resgatar ofertas, acumular pontos e indicar amigos.</p>${button('Entrar ou criar conta',"go('login')")}`}
function login(){return `<div class="text-center pt-5"><span class="text-5xl">🔒</span><h1 class="text-4xl font-bold mt-5">Bem-vindo</h1><p class="muted mt-3">Entre e aproveite as ofertas<br>do Shopping Exemplo</p></div><div class="mt-14"><p class="text-xs muted">Acesso simulado como Ana. Use dados fictícios.</p><label for="email">E-mail</label><input id="email" type="email" placeholder="Seu e-mail"><label for="password">Senha</label><input id="password" type="password" placeholder="Senha de demonstração"><label for="referral">Código de indicação (opcional)</label><input id="referral" placeholder="Ex.: BRUNO100"><p class="text-sm text-red-700 mt-2" role="status">${escapeText(message)}</p>${button('Entrar',"signIn()")}${button('Criar conta',"signIn()",true)}<p class="text-center muted my-4">ou</p>${button('Continuar com Google',"signIn()",true)}${button('Continuar com Apple',"signIn()",true)}${button('Continuar como visitante',"switchUser('guest')",true)}<p class="text-xs text-center muted mt-5">${badge()} Todos os acessos são simulados.</p></div>`}
function referral(){if(!user())return invitation();return `${header('Indicar amigos')}<h2 class="text-3xl font-bold">Bom para você.<br>Bom para quem vem.</h2><p class="muted my-4">100 pontos para cada pessoa na primeira compra comprovada do indicado.</p>${badge('Valor ilustrativo')}<div class="ticket mt-5"><p class="text-sm">Seu código pessoal</p><p class="display text-3xl font-bold mt-3">${current==='bruno'?'BRUNO100':'ANA100'}</p>${button('Compartilhar código',"shareReferral()")}</div><h3 class="font-bold mt-6">Suas indicações</h3><p class="text-sm mt-2">${current==='bruno'?'1 indicação concluída no histórico inicial. '+(state.users.ana.referrer?'Ana · '+(state.users.ana.bonus?'bônus creditado':'aguardando primeira compra'):''):'Nenhuma indicação enviada nesta sessão.'}</p>`}
function shareReferral(){const text='Venha ao Shopping Exemplo! Código '+(current==='bruno'?'BRUNO100':'ANA100');if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>notice('Código copiado para compartilhar.')).catch(()=>notice(text));else notice(text)}
function profile(){
 const groups=[['Visitante','Acompanhe ofertas, compras e pontos.'],['Lojista','Publique ofertas e confirme compras.'],['Shopping','Acompanhe campanhas e libere lotes.']];
 return header('Perfil')+'<p class="muted text-sm mb-6">Escolha o perfil para explorar o app.</p>'+groups.map(([name,description])=>'<section class="mb-6"><h2 class="text-xl font-bold">'+name+'</h2><p class="text-sm muted mt-1 mb-3">'+description+'</p><div class="grid gap-2">'+Object.entries(people).filter(([id,person])=>person.role===name).map(([id,person])=>'<button class="card w-full flex items-center gap-3 text-left '+(id===current?'!border-[#a44614] !bg-[#fff7e9]':'')+'" onclick="switchUser(&quot;'+id+'&quot;)"><span class="rounded-full bg-[#f9ebd9] w-10 h-10 flex items-center justify-center font-bold text-[#a44614]">'+person.name[0]+'</span><span class="flex-1"><strong class="block">'+person.name+'</strong><span class="text-xs muted">'+(id===current?'Perfil atual':name)+'</span></span><span aria-hidden="true">'+(id===current?'✓':'→')+'</span></button>').join('')+'</div></section>').join('');
}
function merchant(){const own=state.offers.filter(item=>item.owner===current);return `${header(people[current].name)}<p class="muted mb-4">Área do lojista</p>${button('Criar oferta relâmpago',"go('create')")}${button('Confirmar compra',"go('confirm')",true)}<h2 class="text-xl font-bold my-5">Suas ofertas</h2>${own.map(item=>`<div>${offerCard(item)}<p class="text-sm mb-3">${item.total-item.stock} resgates · ${item.stock} restantes</p>${button('Encerrar oferta',`closeOffer('${item.id}')`,true,status(item)==='Encerrada')}</div>`).join('')}`}
function closeOffer(id){state.offers.find(item=>item.id===id).closed=true;render();notice('Oferta encerrada para todos os perfis.')}
function create(){return `${header('Oferta relâmpago')}<p class="muted">Publique uma oportunidade para agora.</p><label for="product">Produto</label><input id="product" maxlength="70" value="Café expresso"><label for="discount">Desconto (%)</label><input id="discount" type="number" min="1" max="100" value="20"><label for="duration">Duração</label><select id="duration"><option value="180">3 minutos · demonstração</option><option value="30">30 segundos · teste de prazo</option><option value="120">2 minutos</option></select><label for="quantity">Quantidade</label><input id="quantity" type="number" min="1" max="1000" value="5"><p role="status" class="text-sm mt-3">${escapeText(message)}</p>${button('Pré-visualizar',"previewOffer()")}`}
function previewOffer(){draft={title:$('product').value.trim(),discount:Number($('discount').value),duration:Number($('duration').value),stock:Number($('quantity').value)};if(!draft.title||!Number.isInteger(draft.stock)||draft.stock<1||draft.stock>1000||draft.discount<1||draft.discount>100){message='Informe produto, desconto de 1 a 100 e quantidade inteira de 1 a 1.000.';render();return}go('preview')}
function publish(){if(!draft)return;state.offers.push({...draft,id:'flash'+(++state.sequence),owner:current,store:people[current].name,total:draft.stock,start:Date.now(),end:Date.now()+draft.duration*1000,emoji:'☕'});draft=null;go('home');notice('Oferta publicada. Os visitantes já podem resgatar.')}
function dashboard(){return `${header('Painel da campanha')}<div class="hero"><p>Shopping Exemplo</p><h2 class="text-4xl font-bold mt-2">Campanha 11/11</h2><p class="mt-3">Lote de 5 placas de vídeo · surpresa</p><p class="mt-2">${status(state.offers[0])}</p>${button('Liberar lote agora',"release()",false,status(state.offers[0])!=='Em breve')}</div><div class="grid grid-cols-2 gap-3 my-5">${[['Cupons resgatados',state.offers.reduce((sum,o)=>sum+o.total-o.stock,0)],['Compras confirmadas',state.purchases.length+3],['Pontos de compras',state.purchases.reduce((sum,p)=>sum+p.points,0)+320],['Lotes programados',1]].map(([label,value])=>`<div class="card"><strong class="display text-3xl">${value}</strong><p class="text-xs muted mt-2">${label}</p></div>`).join('')}</div><p class="text-xs muted">Dados agregados de demonstração, incluindo histórico inicial.</p>${button('Campanhas',"go('campaigns')",true)}<h2 class="text-xl font-bold my-5">Relâmpago nas lojas</h2>${state.offers.filter(o=>!o.campaign&&status(o)==='Liberada').map(offerCard).join('')}`}
function render(){const routes={home,login,detail,offers:()=>header('Ofertas')+state.offers.map(offerCard).join(''),purchase,points,exchange,coupons,referral,profile,create,preview:()=>header('Pré-visualizar')+`<div class="ticket"><p>${escapeText(draft.title)}</p><h2 class="text-4xl font-bold my-4">${draft.discount}% OFF</h2><p>${draft.stock} cupons · ${draft.duration} segundos</p></div>`+button('Publicar oferta','publish()')+button('Editar',"go('create')",true),confirm:()=>header('Confirmar compra')+badge('Valor ilustrativo')+'<p class="text-sm muted mt-3">1 ponto por R$ 10. Código de uso único válido por 10 minutos.</p><label for="customerCode">Código do cliente</label><input id="customerCode" inputmode="numeric" maxlength="6" placeholder="6 dígitos"><label for="purchaseValue">Valor da compra (R$)</label><input id="purchaseValue" type="number" min="0.01" step="0.01" value="20">'+button('Confirmar compra','confirmPurchase()')+`<p role="status" class="card mt-4">${escapeText(message||'Aguardando o código do visitante.')}</p>`,claimed:()=>header('Cupom garantido')+'<div class="card text-center mt-12"><span class="text-6xl text-green-700">✓</span><h2 class="text-3xl font-bold mt-6">É seu!</h2><p class="muted my-4">Mostre seu cupom no caixa da loja.</p>'+button('Ver em Meus cupons',"go('coupons')")+'</div>',campaigns:()=>header('Campanhas')+['10/10 · Encerrada','11/11 · Atual · cenário simulado','12/12 · Próxima'].map(title=>'<div class="card mb-4"><h2 class="text-xl font-bold">'+title+'</h2></div>').join('')};$('app').innerHTML=(routes[screen]||home)();const visitor=people[current].role==='Visitante'||current==='guest';const nav=visitor?[['home','⌂','Início'],['offers','◇','Ofertas'],['purchase','＋','Compra'],['points','◉','Pontos'],['profile','○','Perfil']]:people[current].role==='Lojista'?[['home','⌂','Início'],['create','＋','Criar'],['confirm','✓','Compra'],['profile','○','Perfil']]:[['home','⌂','Painel'],['campaigns','◇','Campanhas'],['profile','○','Perfil']];$('nav').innerHTML=screen==='login'?'':nav.map(([target,icon,title])=>`<button class="${screen===target?'active':''}" onclick="go('${target}')"><span class="block text-xl mb-1">${icon}</span>${title}</button>`).join('');}
setInterval(()=>{const item=state.offers[0];if(!item.released&&Date.now()>=item.start)release();for(const node of document.querySelectorAll('[data-clock]'))node.textContent=remaining(Number(node.dataset.clock));const pending=state.notices.find(n=>n.id===current&&!n.read);if(pending){pending.read=true;notice('Simulação · '+pending.text)}const fingerprint=state.offers.map(o=>status(o)).join('|');if(state.fingerprint&&state.fingerprint!==fingerprint&&['home','detail','offers'].includes(screen))render();state.fingerprint=fingerprint;},1000);
render();
</script></body></html>
